<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蛋岛宠物</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  /* 层级：#stage(1) → #fx(2) → #bubble(3)。
     花草挂在前景层，但锚点落在脚底略偏下（见 pet.js 的 groundPoint），
     所以是「长在她脚前面的地上」，看得见，也不会盖住脚。 */
  #stage { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }
  #err {
    z-index: 9;
    position: fixed; inset: 0; display: none; padding: 14px;
    font: 11px/1.5 "Microsoft YaHei", monospace;
    color: #7a3020; background: rgba(255,246,240,.96);
    white-space: pre-wrap; overflow: auto;
  }
  #err.show { display: block; }

  /* ---------- 前景特效层：纯 DOM，透明窗口里比 WebGL 精灵更醒目 ----------
     参考 React Bits 的 ClickSpark / Particles，用原生 CSS 复刻。 */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }

  /* 星尘：柔光核心 + 十字星芒 + 放射拖尾 */
  /* 透明 Electron 窗口里 clip-path / filter / mix-blend-mode 都会被 alpha 合成吃掉，
     所以这里只用最老实的 border-radius + 实色渐变 + box-shadow，靠形状和尺寸取胜。 */
  .fx-spark {
    position: absolute; width: var(--sz, 11px); height: var(--sz, 11px);
    border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #fff 0%, var(--c) 52%, var(--c) 100%);
    box-shadow: 0 0 7px 2px var(--c), 0 0 16px 5px var(--c);
    will-change: transform, opacity;
    animation: sparkFly var(--dur) cubic-bezier(.22,1,.36,1) var(--delay) forwards;
  }
  .fx-spark::before, .fx-spark::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    background: #fff; opacity: .9; border-radius: 2px;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 6px 1px var(--c);
  }
  .fx-spark::before { width: 19px; height: 2px; }
  .fx-spark::after  { width: 2px; height: 19px; }
  @keyframes sparkFly {
    0%   { transform: translate(0,0) scale(.2) rotate(0deg); opacity: 0; }
    14%  { opacity: 1; }
    62%  { opacity: .9; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.5) rotate(var(--rot)); opacity: 0; }
  }

  /* 文字类（Zzz）保留，其余一律走星尘 */
  .fx-bit {
    position: absolute; line-height: 1; will-change: transform, opacity;
    text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
    animation: fxFloat var(--dur) cubic-bezier(.22,1,.36,1) var(--delay) forwards;
  }
  @keyframes fxFloat {
    0%   { transform: translate(0,0) scale(.4) rotate(0deg); opacity: 0; }
    16%  { opacity: 1; }
    72%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.12) rotate(var(--rot)); opacity: 0; }
  }

  /* ---------- 地面花草：一株 = 草叶 + 花茎 + 叶 + 外瓣 + 内瓣 + 花心 ----------
     生长顺序：0ms 冒草 → 180ms 抽茎 → 420ms 长叶 → 600ms 外瓣开 → 760ms 内瓣
     → 1000ms 花心 → 2.6~3.6s 整株淡出。
     花瓣是椭圆渐变、两层错开角度，不是六片正圆贴纸，所以才有体积感。 */
  .fx-grass {
    position: absolute; width: 0; height: 0;
    transform-origin: 0 0;
    scale: var(--s, 1);
    rotate: var(--tilt, 0deg);
    animation: grassLife var(--dur, 3000ms) ease-out forwards;
  }
  @keyframes grassLife {
    0% { opacity: 0; }
    9% { opacity: 1; }
    74% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* 草叶：贴着地面抽出来，长成后轻轻摆 */
  .fx-grass .blade {
    position: absolute; left: 0; bottom: 0;
    width: 1.8px; height: var(--h, 18px);
    margin-left: -0.9px;
    border-radius: 55% 55% 12% 12% / 92% 92% 0 0;
    background: linear-gradient(180deg, var(--g1, #b6dc8e) 0%, var(--g2, #6fae55) 58%, var(--g3, #3f7c3a) 100%);
    opacity: .94;
    transform-origin: 50% 100%;
    rotate: var(--a, 0deg);
    scale: 1 0;
    animation:
      bladeGrow 760ms cubic-bezier(.18,.86,.28,1) var(--d, 0ms) forwards,
      bladeSway 2400ms ease-in-out calc(var(--d, 0ms) + 760ms) infinite;
  }
  @keyframes bladeGrow { 0% { scale: 1 0; } 68% { scale: 1.05 1.07; } 100% { scale: 1 1; } }
  @keyframes bladeSway {
    0%, 100% { rotate: calc(var(--a, 0deg) - 2.5deg); }
    50%      { rotate: calc(var(--a, 0deg) + 2.5deg); }
  }

  .fx-grass .stem {
    position: absolute; left: 0; bottom: 0;
    width: 1.3px; height: var(--stem, 13px);
    margin-left: -0.65px; border-radius: 1px;
    background: linear-gradient(180deg, #86b968 0%, #578f45 58%, #3f7034 100%);
    transform-origin: 50% 100%;
    scale: 1 0;
    animation: stemGrow 720ms cubic-bezier(.18,.86,.28,1) 180ms forwards;
  }
  @keyframes stemGrow { 0% { scale: 1 0; } 66% { scale: 1 1.04; } 100% { scale: 1 1; } }

  .fx-grass .leaf {
    position: absolute; left: 0; bottom: calc(var(--stem, 13px) * .42);
    width: 6px; height: 3.4px;
    border-radius: 100% 8% 100% 8% / 100% 8% 100% 8%;
    background: linear-gradient(118deg, #a2d67c 0%, #5e9b48 100%);
    transform-origin: 0 50%;
    rotate: var(--la, -34deg);
    scale: 0;
    animation: leafOut 460ms cubic-bezier(.2,1.3,.4,1) 420ms forwards;
  }
  @keyframes leafOut { to { scale: 1; } }

  .fx-grass .bud {
    position: absolute; left: 0; bottom: var(--stem, 14px);
    width: 0; height: 0;
    rotate: var(--br, 0deg);
  }
  /* 外层花瓣：略大、更淡，负责轮廓 */
  .fx-grass .petal {
    position: absolute; left: -2.4px; top: -7.4px;
    width: 4.8px; height: 7.4px;
    border-radius: 54% 54% 46% 46% / 62% 62% 38% 38%;
    /* 根部偏白、尖端带色，像真花瓣的透光渐变，不是一整块纯色 */
    background: linear-gradient(184deg, var(--p2, #ffc2dd) 0%, var(--p1, #fff6fb) 46%, #fffdfa 100%);
    /* 只用内阴影勾边，不加外发光：外发光会让整朵花糊成一团光斑 */
    box-shadow: inset 0 0 0 .45px rgba(168,96,128,.22), inset 0 -1px 1.4px rgba(148,78,108,.16);
    opacity: .97;
    transform-origin: 50% 100%;
    rotate: var(--pa, 0deg);
    translate: 0 -.8px;
    scale: 1 0;
    animation: petalOut 560ms cubic-bezier(.16,1.1,.3,1) var(--pd, 600ms) forwards;
  }
  @keyframes petalOut {
    0%   { scale: .15 0; opacity: 0; }
    55%  { scale: 1.04 1.06; opacity: 1; }
    100% { scale: 1 1; opacity: 1; }
  }
  /* 内层花瓣：小一圈、颜色更沉，压在外瓣中间才不像平面剪贴 */
  .fx-grass .petal.in {
    left: -1.8px; top: -5.4px;
    width: 3.6px; height: 5.4px;
    background: linear-gradient(184deg, var(--p2, #ffc2dd) 0%, var(--p1, #fff6fb) 82%);
    opacity: .92;
    translate: 0 -.3px;
    animation-delay: var(--pd2, 760ms);
  }
  /* 花心：一颗暖色小圆 + 三粒花粉点 */
  .fx-grass .core {
    position: absolute; left: -2.9px; top: -2.9px;
    width: 5.8px; height: 5.8px; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 30%, #fff3b0 0 1px, transparent 1.4px),
      radial-gradient(circle at 66% 42%, #ffe98e 0 .9px, transparent 1.2px),
      radial-gradient(circle at 44% 70%, #ffdf8a 0 1px, transparent 1.3px),
      radial-gradient(circle at 36% 32%, #ffe08a 0%, #f5bf4e 58%, #cf8f28 100%);
    box-shadow: inset 0 .8px 1.2px rgba(255,255,255,.85);
    scale: 0;
    animation: coreOut 420ms cubic-bezier(.2,1.5,.4,1) 1000ms forwards;
  }
  @keyframes coreOut { to { scale: 1; } }

  /* 飘落的花瓣：实体渐变花瓣，不再是 ❀ 字符 */
  .fx-flake {
    position: absolute; display: block; width: 11px; height: 16px;
    border-radius: 70% 70% 45% 45% / 80% 80% 30% 30%;
    background: linear-gradient(160deg, #fff 0%, var(--c) 65%);
    box-shadow: 0 0 8px var(--c);
    animation: flakeFall var(--dur) cubic-bezier(.3,.5,.6,1) var(--delay) forwards;
  }
  @keyframes flakeFall {
    0%   { transform: translate(0,0) rotate(0deg) scale(var(--s,1)); opacity: 0; }
    12%  { opacity: .95; }
    100% { transform: translate(var(--dx), 250px) rotate(320deg) scale(var(--s,1)); opacity: 0; }
  }

  /* 贴边提示：拖动时靠近哪条边，那条边就亮一下，让"会被吸住"看得见 */
  #edgeHint {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    opacity: 0; transition: opacity .16s ease;
  }
  #edgeHint.on { opacity: 1; }
  #edgeHint::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 14px;
    background: linear-gradient(90deg, rgba(255,140,190,.55), rgba(255,140,190,0));
  }
  #edgeHint.left::before { left: 0; }
  #edgeHint.right::before { right: 0; transform: scaleX(-1); left: auto; }
  #edgeHint::after {
    content: ''; position: absolute; left: 0; right: 0; height: 12px;
    background: linear-gradient(180deg, rgba(255,140,190,.5), rgba(255,140,190,0));
    opacity: 0;
  }
  #edgeHint.top::after { top: 0; opacity: 1; }
  #edgeHint.bottom::after { bottom: 0; top: auto; opacity: 1; transform: scaleY(-1); }

  /* 门框：贴边探头时，屏幕最外侧立起一条很窄的框沿。
     有这条边，脑袋才是「从门框后探出来」，而不是悬在窗口里的一颗头。 */
  #peekFrame {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    opacity: 0; transition: opacity .3s ease;
  }
  #peekFrame.on { opacity: 1; }
  #peekFrame::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 9px;
    background: linear-gradient(90deg,
      rgba(255,255,255,.90) 0%, rgba(255,247,251,.60) 45%, rgba(255,240,248,.14) 100%);
    border-right: 1px solid rgba(255,255,255,.82);
    box-shadow: 3px 0 12px rgba(90,60,90,.16);
  }
  #peekFrame.left::before { left: 0; }
  #peekFrame.right::before { right: 0; left: auto; transform: scaleX(-1); }
  #peekFrame::after {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,0));
  }

  /* 连击数字：在她头顶弹一下再上飘淡出 */
  .fx-combo {
    position: absolute; left: 50%; top: 16%;
    transform: translateX(-50%);
    font: 800 26px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
    /* 白字在浅色壁纸上会彻底消失，改成粉字 + 四向白描边，深浅桌面都看得清 */
    color: #ff3f86; letter-spacing: .5px;
    text-shadow: -2px 0 rgba(255,255,255,.95), 2px 0 rgba(255,255,255,.95),
                 0 -2px rgba(255,255,255,.95), 0 2px rgba(255,255,255,.95),
                 0 4px 12px rgba(255,90,150,.55);
    animation: comboPop 900ms cubic-bezier(.2,1.4,.4,1) forwards;
    pointer-events: none;
  }
  @keyframes comboPop {
    0%   { opacity: 0; transform: translateX(-50%) scale(.4); }
    22%  { opacity: 1; transform: translateX(-50%) scale(1.18); }
    40%  { transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-26px) scale(.92); }
  }

  /* 走路留下的脚印（Desktop Goose 那种）：踩在桌面上的痕迹，慢慢淡掉 */
  .fx-foot {
    position: absolute; width: 7px; height: 10px;
    border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 50% 40%, rgba(90,72,82,.42), rgba(90,72,82,.16) 70%, rgba(90,72,82,0) 100%);
    animation: footFade 2.6s ease-out forwards;
  }
  @keyframes footFade {
    0%   { opacity: 0; transform: scale(.6); }
    18%  { opacity: .9; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.04); }
  }

  @media (prefers-reduced-motion: reduce) {
    .fx-spark, .fx-bit, .fx-flake, .fx-grass, .fx-grass .blade,
    .fx-grass .stem, .fx-grass .leaf, .fx-grass .petal,
    .fx-grass .core { animation-duration: 1ms !important; }
  }

  /* 说话气泡：半透明玻璃 + 柔光 + 指向角色的小尖角 */
  #bubble {
    position: fixed; left: 50%; top: 0.5%; transform: translate(-50%, 0);
    pointer-events: none; opacity: 0; z-index: 3;
    max-width: 132px; padding: 3px 9px; border-radius: 12px;
    /* 之前 4% + 11.5px 正好压在眼睛上，压到帽子边缘才行 */
    font: 600 10.5px/1.4 "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #6d4a5e; text-align: center; white-space: normal;
    /* backdrop-filter 在透明窗口里会在角色头后糊出一块黑斑，改用不透明度更高的渐变 */
    background: linear-gradient(180deg, rgba(255,255,255,.93), rgba(255,246,252,.87));
    border: 1px solid rgba(255,255,255,.82);
    /* 26px 的大模糊在透明窗口上会露出一圈彩色色带（截图里像彩虹环），收到 8px */
    box-shadow: 0 2px 8px rgba(188,116,158,.20),
                inset 0 1px 0 rgba(255,255,255,.92),
                inset 0 -1px 0 rgba(255,255,255,.35);
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -7px;
    width: 12px; height: 12px; border-radius: 0 0 4px 0;
    background: rgba(255,248,252,.90);
    border-right: 1px solid rgba(255,255,255,.82);
    border-bottom: 1px solid rgba(255,255,255,.82);
    transform: translateX(-50%) rotate(45deg);
  }
  #bubble.show { animation: bubblePop var(--bdur, 4.6s) ease forwards; }
  @keyframes bubblePop {
    0%   { opacity: 0; transform: translate(-50%, 10px) scale(.82); }
    7%   { opacity: 1; transform: translate(-50%, 0) scale(1); }
    86%  { opacity: 1; transform: translate(-50%, -3px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -12px) scale(.96); }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="edgeHint"></div>
<div id="peekFrame"></div>
<div id="fx"></div>
<div id="bubble"></div>
<div id="err"></div>
<script>
  // 加载失败时把错误显示在窗口里，别白屏
  function showErr(msg) {
    var el = document.getElementById('err');
    el.textContent = '出错了：\n' + msg;
    el.classList.add('show');
  }
  window.addEventListener('error', function (e) {
    showErr((e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    showErr(String((r && (r.stack || r.message)) || r));
  });
</script>
<script type="module" src="./pet.js"></script>
</body>
</html>
