<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: rgba(0,0,0,.28);
    cursor: crosshair; user-select: none;
    font: 13px "Microsoft YaHei", sans-serif;
  }
  #box {
    position: absolute; display: none;
    border: 1.5px solid #4a9eff;
    background: rgba(74,158,255,.10);
    box-shadow: 0 0 0 9999px rgba(0,0,0,.30);
  }
  #hint {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.68); color: #fff;
    padding: 7px 16px; border-radius: 999px; font-size: 12.5px;
    white-space: nowrap;
  }
  #size {
    position: absolute; padding: 3px 8px; border-radius: 5px;
    background: rgba(0,0,0,.72); color: #fff; font-size: 11px;
    display: none;
  }
</style>
</head>
<body>
<div id="hint">拖一个框圈出要问的部分 · Esc 取消</div>
<div id="box"></div>
<div id="size"></div>
<script>
  const box = document.getElementById('box');
  const sizeTag = document.getElementById('size');
  let sx = 0, sy = 0, dragging = false;

  function draw(x, y) {
    const left = Math.min(sx, x);
    const top = Math.min(sy, y);
    const w = Math.abs(x - sx);
    const h = Math.abs(y - sy);
    box.style.display = 'block';
    box.style.left = left + 'px';
    box.style.top = top + 'px';
    box.style.width = w + 'px';
    box.style.height = h + 'px';
    sizeTag.style.display = 'block';
    sizeTag.textContent = w + ' × ' + h;
    sizeTag.style.left = left + 'px';
    sizeTag.style.top = Math.max(0, top - 24) + 'px';
    return { x: left, y: top, w, h };
  }

  window.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    sx = e.clientX;
    sy = e.clientY;
    document.getElementById('hint').style.display = 'none';
  });

  window.addEventListener('mousemove', (e) => {
    if (dragging) draw(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    const r = draw(e.clientX, e.clientY);
    if (r.w < 8 || r.h < 8) {
      window.pet.snipDone(null);
      return;
    }
    window.pet.snipDone(r);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.pet.snipDone(null);
  });
</script>
</body>
</html>
