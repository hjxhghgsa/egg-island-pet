<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>和她说话</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    font: 13px/1.6 "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    color: #4a3a2c;
    -webkit-user-select: none; user-select: none;
  }

  /* 卡片：留 12px 边走阴影，玻璃本体铺满剩余 */
  .card {
    position: absolute;
    inset: 12px;
    border-radius: 20px;
    overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, rgba(255,252,246,.58), rgba(255,234,208,.42));
    backdrop-filter: blur(22px) saturate(1.5);
    box-shadow:
      0 14px 44px rgba(120,80,40,.28),
      0 3px 10px rgba(120,80,40,.14),
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -1px 0 rgba(255,255,255,.45);
    border: 1px solid rgba(255,255,255,.72);
  }

  /* 光影：右上暖光 + 左下冷光 + 顶部高光 */
  .card::before {
    content: ''; position: absolute; pointer-events: none;
    width: 260px; height: 260px; right: -70px; top: -90px;
    background: radial-gradient(circle, rgba(255,196,120,.55), rgba(255,196,120,0) 68%);
    filter: blur(18px);
  }
  .card::after {
    content: ''; position: absolute; pointer-events: none;
    width: 220px; height: 220px; left: -80px; bottom: -80px;
    background: radial-gradient(circle, rgba(150,200,255,.32), rgba(150,200,255,0) 70%);
    filter: blur(20px);
  }

  header {
    -webkit-app-region: drag;
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px 10px;
    border-bottom: 1px solid rgba(255,255,255,.5);
    flex-shrink: 0;
  }
  header img {
    width: 26px; height: 26px; border-radius: 50%;
    object-fit: cover; background: rgba(255,255,255,.6);
    box-shadow: 0 2px 6px rgba(150,110,70,.18);
  }
  header .name { font-weight: 600; font-size: 13px; letter-spacing: .3px; }
  header .sp { flex: 1; }
  header button {
    -webkit-app-region: no-drag;
    border: none; cursor: pointer; color: #a08a72; font-size: 15px;
    width: 26px; height: 26px; border-radius: 8px;
    background: rgba(255,255,255,.5);
    transition: background .15s;
  }
  header button:hover { background: rgba(255,255,255,.9); }
  header button.on { background: #ffc978; color: #fff; }

  #log {
    position: relative; z-index: 2;
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #log::-webkit-scrollbar { width: 5px; }
  #log::-webkit-scrollbar-thumb { background: rgba(200,170,140,.45); border-radius: 3px; }

  .msg {
    max-width: 84%; padding: 9px 13px; border-radius: 15px;
    white-space: pre-wrap; word-break: break-word;
    color: #33261a;
    text-shadow: 0 1px 0 rgba(255,255,255,.55);
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } }
  .me {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(255,214,150,.96), rgba(255,186,102,.94));
    border-bottom-right-radius: 5px;
    box-shadow: 0 3px 12px rgba(230,160,70,.3), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .her {
    align-self: flex-start;
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(255,255,255,.95);
    border-bottom-left-radius: 5px;
    box-shadow: 0 3px 12px rgba(160,120,80,.14), inset 0 1px 0 rgba(255,255,255,.95);
  }
  .tip {
    align-self: center; color: #5d4a35; font-size: 11px;
    background: rgba(255,252,245,.88);
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.9);
    text-align: center; line-height: 1.5;
  }

  footer {
    position: relative; z-index: 2;
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 12px 12px;
    border-top: 1px solid rgba(255,255,255,.5);
    flex-shrink: 0;
  }
  #inp {
    flex: 1; border: 1px solid rgba(255,255,255,.95); border-radius: 12px;
    padding: 9px 12px; font: inherit; resize: none; height: 40px;
    outline: none; background: rgba(255,255,255,.9);
    color: #33261a;
    transition: border-color .15s, background .15s;
  }
  #inp:focus { border-color: rgba(255,190,120,.95); background: rgba(255,255,255,.98); }
  #inp::placeholder { color: #9c8871; }

  .icobtn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.72); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0; backdrop-filter: blur(6px);
  }
  .icobtn:hover { background: rgba(255,255,255,.95); }
  .icobtn:disabled { opacity: .45; cursor: default; }
  #mic.rec { background: linear-gradient(135deg,#ff9a76,#ff7b5a); border-color: #ff8b62; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255,130,90,.18); } }
  #send {
    border: none; border-radius: 12px; padding: 0 16px; height: 40px; cursor: pointer;
    background: linear-gradient(135deg,#ffc06a,#f79b3f); color: #fff; font-weight: 600; font: inherit;
    box-shadow: 0 4px 14px rgba(240,150,60,.35), inset 0 1px 0 rgba(255,255,255,.45);
    flex-shrink: 0;
  }
  #send:disabled { background: rgba(230,210,190,.7); box-shadow: none; cursor: default; }

  /* 设置面板 */
  #setup {
    position: absolute; inset: 0; z-index: 5;
    background: linear-gradient(160deg, rgba(255,252,246,.97), rgba(255,240,222,.95));
    padding: 18px; display: none; flex-direction: column; gap: 8px;
    font-size: 12px;
  }
  #setup.show { display: flex; }
  #setup h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  #setup label { color: #8b7358; margin-top: 4px; }
  #setup input {
    width: 100%; border: 1px solid rgba(220,200,180,.9); border-radius: 9px;
    padding: 8px 10px; font: inherit; outline: none; background: rgba(255,255,255,.85);
  }
  #setup input:focus { border-color: #ffbe78; }
  #setup .row { display: flex; gap: 8px; margin-top: 10px; }
  #setup button { flex: 1; border: none; border-radius: 9px; padding: 10px; cursor: pointer; font: inherit; }
  #setup .ok { background: linear-gradient(135deg,#ffc06a,#f79b3f); color: #fff; font-weight: 600; }
  #setup .cancel { background: rgba(235,220,205,.9); color: #7a6650; }
  #setup .hint { color: #a08a72; font-size: 11px; line-height: 1.55; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <header>
    <img src="../icon.png" alt="">
    <span class="name">蛋糕纯</span>
    <span class="sp"></span>
    <button id="voice" title="自动朗读回复">🔊</button>
    <button id="gear" title="设置接口">⚙</button>
    <button id="close" title="关闭">✕</button>
  </header>

  <div id="log"></div>

  <footer>
    <button id="eye" class="icobtn" title="看一眼我的屏幕">👁</button>
    <button id="mic" class="icobtn" title="按住说话">🎤</button>
    <textarea id="inp" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </footer>

  <div id="setup">
    <h3>接口设置</h3>
    <label>接口地址（OpenAI 兼容）</label>
    <input id="cfgUrl" placeholder="http://localhost:11434/v1 或 https://api.deepseek.com/v1">
    <label>模型名</label>
    <input id="cfgModel" placeholder="qwen2.5:7b / deepseek-chat">
    <label>API Key（本地 Ollama 随便填）</label>
    <input id="cfgKey" type="password" placeholder="sk-...">
    <label>视觉模型（看屏幕用，可留空）</label>
    <input id="cfgVision" placeholder="glm-4v-flash / gpt-4o-mini / qwen-vl-max">
    <div class="hint">
      本机有 Ollama：<b>http://localhost:11434/v1</b>，模型填 <b>ollama list</b> 里的名字，Key 随便写。<br>
      看屏幕需要支持图片输入的模型；留空则用上面的主模型。
    </div>
    <div class="row">
      <button class="cancel" id="cfgCancel">取消</button>
      <button class="ok" id="cfgSave">保存</button>
    </div>
  </div>
</div>
<script src="./chat.js"></script>
</body>
</html>
