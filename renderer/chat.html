<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>和她说话</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    font: 13px/1.65 "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    color: #2b2b2b;
    -webkit-user-select: none; user-select: none;
  }

  .card {
    position: absolute; inset: 10px;
    border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column;
    background: rgba(255,255,255,.52);
    backdrop-filter: blur(26px) saturate(1.6);
    box-shadow:
      0 12px 40px rgba(0,0,0,.16),
      0 2px 8px rgba(0,0,0,.06),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -1px 0 rgba(255,255,255,.4);
    border: 1px solid rgba(255,255,255,.72);
  }
  /* 极淡的冷色高光，不要橙 */
  .card::before {
    content: ''; position: absolute; pointer-events: none;
    width: 240px; height: 240px; right: -80px; top: -100px;
    background: radial-gradient(circle, rgba(255,255,255,.75), rgba(255,255,255,0) 70%);
    filter: blur(14px);
  }
  .card::after {
    content: ''; position: absolute; pointer-events: none;
    width: 200px; height: 200px; left: -70px; bottom: -80px;
    background: radial-gradient(circle, rgba(200,220,255,.30), rgba(200,220,255,0) 70%);
    filter: blur(16px);
  }

  header {
    -webkit-app-region: drag;
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 9px;
    padding: 10px 13px 9px;
    border-bottom: 1px solid rgba(255,255,255,.65);
    flex-shrink: 0;
  }
  header img {
    width: 24px; height: 24px; border-radius: 50%;
    object-fit: cover; background: rgba(255,255,255,.7);
  }
  header .name { font-weight: 600; font-size: 12.5px; letter-spacing: .3px; color: #333; }
  header .sp { flex: 1; }
  header button {
    -webkit-app-region: no-drag;
    border: none; cursor: pointer; color: #8a8a8a; font-size: 14px;
    width: 25px; height: 25px; border-radius: 7px;
    background: rgba(255,255,255,.55);
    transition: background .15s, color .15s;
  }
  header button:hover { background: #fff; color: #444; }
  header button.on { background: #fff; color: #2f7cf6; }

  #log {
    position: relative; z-index: 2;
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 9px;
  }
  #log::-webkit-scrollbar { width: 5px; }
  #log::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 3px; }

  .msg {
    max-width: 84%; padding: 8px 12px; border-radius: 13px;
    white-space: pre-wrap; word-break: break-word;
    color: #262626; font-size: 12.5px;
    animation: pop .16s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(5px) scale(.98); } }
  .me {
    align-self: flex-end;
    background: rgba(255,255,255,.92);
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
  }
  .her {
    align-self: flex-start;
    background: rgba(240,244,250,.88);
    border: 1px solid rgba(255,255,255,.8);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .tip {
    align-self: center; color: #6d6d6d; font-size: 11px;
    background: rgba(255,255,255,.8);
    padding: 4px 11px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.9);
    text-align: center; line-height: 1.55; max-width: 92%;
  }

  /* 圈选预览 */
  .snip-wrap {
    align-self: flex-end; display: flex; flex-direction: column; gap: 6px;
    max-width: 78%;
  }
  .snip-img {
    max-width: 100%; max-height: 130px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 2px 10px rgba(0,0,0,.10);
    background: rgba(255,255,255,.6);
    object-fit: contain;
    /* 透明背景用棋盘格衬一下 */
    background-image:
      linear-gradient(45deg, #eee 25%, transparent 25%),
      linear-gradient(-45deg, #eee 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #eee 75%),
      linear-gradient(-45deg, transparent 75%, #eee 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0;
  }
  .snip-row { display: flex; gap: 6px; justify-content: flex-end; }
  .snip-btn {
    border: none; border-radius: 8px; padding: 5px 11px; cursor: pointer;
    font: inherit; font-size: 11.5px;
    background: rgba(255,255,255,.9); color: #555;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .snip-btn:hover { background: #fff; }
  .snip-btn.primary { background: #2f7cf6; color: #fff; }
  .snip-btn.primary:hover { background: #2a6fe0; }

  footer {
    position: relative; z-index: 2;
    display: flex; gap: 7px; align-items: flex-end;
    padding: 9px 11px 11px;
    border-top: 1px solid rgba(255,255,255,.65);
    flex-shrink: 0;
  }
  #inp {
    flex: 1; border: 1px solid rgba(255,255,255,.9); border-radius: 11px;
    padding: 9px 11px; font: inherit; resize: none; height: 38px;
    outline: none; background: rgba(255,255,255,.88);
    color: #262626; font-size: 12.5px;
    transition: border-color .15s, background .15s;
  }
  #inp:focus { border-color: rgba(120,160,220,.7); background: #fff; }
  #inp::placeholder { color: #9d9d9d; }

  .icobtn {
    width: 38px; height: 38px; border-radius: 11px; border: 1px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.8); cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0;
  }
  .icobtn:hover { background: #fff; }
  .icobtn:disabled { opacity: .4; cursor: default; }
  #mic.rec { background: #ff5b5b; border-color: #ff5b5b; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255,90,90,.16); } }
  #send {
    border: none; border-radius: 11px; padding: 0 15px; height: 38px; cursor: pointer;
    background: rgba(255,255,255,.95); color: #2f7cf6; font-weight: 600; font: inherit; font-size: 12.5px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08), inset 0 -1px 0 rgba(0,0,0,.04);
    flex-shrink: 0;
  }
  #send:hover { background: #fff; }
  #send:disabled { color: #b5b5b5; cursor: default; }

  #setup {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(20px);
    padding: 16px; display: none; flex-direction: column; gap: 7px;
    font-size: 11.5px; overflow-y: auto;
  }
  #setup.show { display: flex; }
  #setup h3 { margin: 0 0 3px; font-size: 13px; font-weight: 600; color: #222; }
  #setup label { color: #777; margin-top: 3px; }
  #setup input {
    width: 100%; border: 1px solid #e2e2e2; border-radius: 8px;
    padding: 7px 9px; font: inherit; outline: none; background: #fff; color: #262626;
  }
  #setup input:focus { border-color: #9ec2f0; }
  #setup select {
    width: 100%; border: 1px solid #e2e2e2; border-radius: 8px;
    padding: 7px 9px; font: inherit; outline: none; background: #fff; color: #262626;
  }
  #setup .row { display: flex; gap: 7px; margin-top: 9px; }
  #setup button { flex: 1; border: none; border-radius: 8px; padding: 9px; cursor: pointer; font: inherit; }
  #setup .ok { background: #2f7cf6; color: #fff; font-weight: 600; }
  #setup .cancel { background: #f0f0f0; color: #666; }
  #setup .hint { color: #8a8a8a; font-size: 10.5px; line-height: 1.5; margin-top: 3px; }

  /* 框选遮罩 */
  #snip {
    position: fixed; inset: 0; z-index: 20; display: none;
    cursor: crosshair; background: rgba(0,0,0,.35);
  }
  #snip.on { display: block; }
  #snipBox {
    position: absolute; border: 1.5px solid #4a9eff;
    background: rgba(74,158,255,.12); display: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.35);
  }
  #snipHint {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.65); color: #fff; padding: 6px 14px; border-radius: 999px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <header>
    <img src="../icon.png" alt="">
    <span class="name">蛋糕纯</span>
    <span class="sp"></span>
    <button id="voice" title="自动朗读回复">🔊</button>
    <button id="gear" title="设置接口">⚙</button>
    <button id="close" title="关闭">✕</button>
  </header>

  <div id="log"></div>

  <footer>
    <button id="eye" class="icobtn" title="看整块屏幕">👁</button>
    <button id="snipBtn" class="icobtn" title="圈一块问她">⬚</button>
    <button id="mic" class="icobtn" title="按住说话">🎤</button>
    <textarea id="inp" placeholder="说点什么…"></textarea>
    <button id="send">发送</button>
  </footer>

  <div id="setup">
    <h3>接口设置</h3>
    <label>接口地址</label>
    <input id="cfgUrl" placeholder="https://api.deepseek.com/v1">
    <label>模型</label>
    <input id="cfgModel" placeholder="deepseek-flash">
    <label>API Key</label>
    <input id="cfgKey" type="password" placeholder="sk-...">
    <label>看图用的模型（可留空）</label>
    <input id="cfgVision" placeholder="deepseek-flash">
    <label>她的声音</label>
    <select id="cfgVoice">
      <option value="zh-CN-XiaoxiaoNeural">晓晓 · 温柔自然（推荐）</option>
      <option value="zh-CN-XiaoyiNeural">晓伊 · 偏甜</option>
      <option value="zh-CN-XiaochenNeural">晓辰 · 知性</option>
      <option value="zh-CN-XiaohanNeural">晓涵 · 沉稳</option>
      <option value="zh-CN-YunxiNeural">云希 · 男声</option>
      <option value="zh-CN-liaoning-XiaobeiNeural">小北 · 东北话</option>
    </select>
    <div class="hint">DeepSeek 的 deepseek-flash 支持图片输入，看屏幕和圈选都用它就行。</div>
    <div class="row">
      <button class="cancel" id="cfgCancel">取消</button>
      <button class="ok" id="cfgSave">保存</button>
    </div>
  </div>
</div>

<div id="snip">
  <div id="snipHint">按住鼠标拖一个框</div>
  <div id="snipBox"></div>
</div>

<script src="./chat.js"></script>
</body>
</html>
