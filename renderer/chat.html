<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>和她说话</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font: 13px/1.6 "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    color: #4a3a2c;
    background: #fffaf3;
    border-radius: 14px;
  }
  body { display: flex; flex-direction: column; }

  header {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    background: linear-gradient(180deg, #fff6e9, #ffeeda);
    border-bottom: 1px solid #f0e0cc;
    flex-shrink: 0;
  }
  header img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: #f5e6d3; }
  header .name { font-weight: 600; font-size: 13px; }
  header .sp { flex: 1; }
  header button {
    -webkit-app-region: no-drag;
    border: none; background: transparent; cursor: pointer;
    color: #a08a72; font-size: 15px; padding: 2px 6px; border-radius: 6px;
  }
  header button:hover { background: #f5e2cc; }

  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: #e8d6c0; border-radius: 3px; }

  .msg { max-width: 82%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: #ffdfae; border-bottom-right-radius: 4px; }
  .her { align-self: flex-start; background: #fff; border: 1px solid #f0e2d0; border-bottom-left-radius: 4px; }
  .tip { align-self: center; color: #b3a08c; font-size: 11px; }

  footer { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid #f0e0cc; flex-shrink: 0; }
  #inp {
    flex: 1; border: 1px solid #e8d6c0; border-radius: 9px;
    padding: 8px 10px; font: inherit; resize: none; height: 38px;
    outline: none; background: #fff;
  }
  #inp:focus { border-color: #f0b97a; }
  #send {
    border: none; border-radius: 9px; padding: 0 15px; cursor: pointer;
    background: #f5a94f; color: #fff; font-weight: 600;
  }
  #send:disabled { background: #e6d3bd; cursor: default; }

  #setup {
    position: absolute; inset: 0; background: rgba(255,250,243,.98);
    padding: 16px; display: none; flex-direction: column; gap: 9px;
    font-size: 12px;
  }
  #setup.show { display: flex; }
  #setup label { color: #8b7358; }
  #setup input {
    width: 100%; border: 1px solid #e8d6c0; border-radius: 7px;
    padding: 7px 9px; font: inherit; outline: none;
  }
  #setup .row { display: flex; gap: 8px; margin-top: 6px; }
  #setup button {
    flex: 1; border: none; border-radius: 7px; padding: 9px; cursor: pointer; font: inherit;
  }
  #setup .ok { background: #f5a94f; color: #fff; font-weight: 600; }
  #setup .cancel { background: #f0e4d4; color: #7a6650; }
  #setup .hint { color: #a08a72; font-size: 11px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <img src="../icon.png" alt="">
  <span class="name">蛋糕纯</span>
  <span class="sp"></span>
  <button id="gear" title="设置接口">⚙</button>
  <button id="close" title="关闭">✕</button>
</header>

<div id="log"></div>

<footer>
  <textarea id="inp" placeholder="和她说话…（Enter 发送）"></textarea>
  <button id="send">发送</button>
</footer>

<div id="setup">
  <label>接口地址（OpenAI 兼容）</label>
  <input id="cfgUrl" placeholder="http://localhost:11434/v1 或 https://api.deepseek.com/v1">
  <label>模型名</label>
  <input id="cfgModel" placeholder="qwen2.5:7b / deepseek-chat">
  <label>API Key（本地 Ollama 随便填）</label>
  <input id="cfgKey" type="password" placeholder="sk-...">
  <div class="hint">本机装了 Ollama 的话填 <b>http://localhost:11434/v1</b>，模型填 ollama list 里的名字，Key 随便写。</div>
  <div class="row">
    <button class="cancel" id="cfgCancel">取消</button>
    <button class="ok" id="cfgSave">保存</button>
  </div>
</div>

<script src="./chat.js"></script>
</body>
</html>
